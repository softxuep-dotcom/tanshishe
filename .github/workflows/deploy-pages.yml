name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test game/street/simulation.test.mjs game/street/mobile-combat.test.mjs game/street/combat-timeline.test.mjs game/street/knockback.test.mjs game/street/encounter.test.mjs game/street/chapter.test.mjs game/street/enemy-ai.test.mjs
      - run: npx tsc --noEmit
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
